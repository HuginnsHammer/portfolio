name: Sync project breakdowns

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-breakdown-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate approved project metadata
        run: python .github/scripts/sync-projects.py
      - name: Commit generated project snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- projects/project-status.json; then
            echo "No project metadata changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/project-status.json
          git commit -m "chore: sync project breakdown metadata"
          git push
